name: 'Test Integration'

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  contents: read

concurrency:
  group: thunderstore-release-compatibility
  cancel-in-progress: false

env:
  THUNDERSTORE_ORGANIZATION: thunderstore-io
  THUNDERSTORE_REPOSITORY: Thunderstore
  # Based on the maintainer's proposed filter. Adjust if upstream moves API code.
  THUNDERSTORE_API_REGEX: '(^|/)(models|api)(/|\.py$)'
  STATE_BRANCH: thunderstore-integration-state
  STATE_FILE: thunderstore-release-state.json

jobs:
  evaluate:
    name: 'Evaluate Thunderstore Release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.release.outputs.should_run }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: 'Fetch release and evaluate API changes (no checkout)'
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_REPOSITORY: ${{ github.repository }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$THUNDERSTORE_ORGANIZATION/$THUNDERSTORE_REPOSITORY/releases/latest" --jq '.tag_name')"
          echo "tag=$current" >> "$GITHUB_OUTPUT"

          # Manual runs do not evaluate release state or file changes.
          if [[ "$MANUAL" == 'true' ]]; then
            echo 'Manual dispatch: run tests unconditionally.'
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # State lives in a separate branch. Only a GitHub API request is needed.
          if encoded="$(gh api "repos/$STATE_REPOSITORY/contents/$STATE_FILE?ref=$STATE_BRANCH" --jq '.content' 2>/dev/null)"; then
            state="$(printf '%s' "$encoded" | base64 --decode)"
          else
            state='{}'
          fi

          status="$(jq -r --arg tag "$current" '.tested_releases[$tag].status // ""' <<< "$state")"
          if [[ "$status" == 'success' || "$status" == 'test_failure' ]]; then
            echo "Release $current has a terminal test outcome ($status)."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous="$(jq -r '(.tested_releases // {} | to_entries | sort_by(.value.recorded_at // "") | last | .key) // empty' <<< "$state")"
          if [[ -z "$previous" ]]; then
            echo 'No previously tested release: run the baseline integration test.'
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A failed comparison must never hide possible incompatibilities.
          if ! files="$(gh api "repos/$THUNDERSTORE_ORGANIZATION/$THUNDERSTORE_REPOSITORY/compare/$previous...$current" --jq '.files[].filename')"; then
            echo 'Could not compare releases: run tests conservatively.'
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(grep -E "$THUNDERSTORE_API_REGEX" <<< "$files" || true)"
          if [[ -n "$changed" ]]; then
            printf 'Relevant changes:\n%s\n' "$changed"
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          else
            echo "No matching API changes from $previous to $current."
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          fi

  test:
    name: 'Run C# Integration Tests'
    needs: evaluate
    if: needs.evaluate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      THUNDERSTORE_DIR: ${{ github.workspace }}/thunderstore
      ARTIFACT_DIR: ${{ github.workspace }}/ThunderPipe.Core.IntegrationTests/artifacts
      THUNDERSTORE_TAG: ${{ needs.evaluate.outputs.tag }}
      THUNDERSTORE_URL: http://thunderstore.localhost/
    steps:
      - name: 'Clone Thunderstore release'
        uses: actions/checkout@v4
        with:
          repository: thunderstore-io/Thunderstore
          ref: ${{ needs.evaluate.outputs.tag }}
          path: thunderstore
          persist-credentials: false
          submodules: false

      - name: 'Clone ThunderPipe'
        uses: actions/checkout@v4
        with:
          path: thunderpipe
          persist-credentials: false

      - name: 'Set up .NET 8 and 10'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: thunderpipe/global.json
          dotnet-version: 8.0.x

      - name: 'Configure isolated Thunderstore'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          echo environment_failure > "$ARTIFACT_DIR/result-category"
          cp "$THUNDERSTORE_DIR/.env.template" "$THUNDERSTORE_DIR/.env"
          mkdir -p "$THUNDERSTORE_DIR/python-packages"

          # Thunderstore 0.188.0 supplies RustFS under the existing minio service name.
          # Its minio-init service creates the S3 buckets and public-read policies.

          # No Remix frontend is running in CI: route package downloads to Django.
          if ! grep -q 'location /package/download/' "$THUNDERSTORE_DIR/nginx/conf/default.conf"; then
            sed -i '/location \/api\//a\    location /package/download/ { proxy_pass http://django:8000; }' \
              "$THUNDERSTORE_DIR/nginx/conf/default.conf"
          fi

          # Workaround for Thunderstore's historical experimental upload validator.
          sed -i 's/validate_markdown(serializer.validated_data\["readme_data"\])/validate_markdown(filename="README.md", readme_data=serializer.validated_data["readme_data"])/' \
            "$THUNDERSTORE_DIR/django/thunderstore/repository/api/experimental/views/validators.py"

          # The test client intentionally permits only .localhost endpoints.
          echo '127.0.0.1 thunderstore.localhost minio.localhost' | sudo tee -a /etc/hosts >/dev/null

      - name: 'Build C# integration test project'
        working-directory: thunderpipe
        shell: bash
        run: |
          set -euo pipefail
          HUSKY=0 dotnet restore ThunderPipe.Core.IntegrationTests/ThunderPipe.Core.IntegrationTests.csproj
          HUSKY=0 dotnet build ThunderPipe.Core.IntegrationTests/ThunderPipe.Core.IntegrationTests.csproj -c Release --no-restore

      - name: 'Start Thunderstore services'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory "$THUNDERSTORE_DIR"
            -f "$THUNDERSTORE_DIR/docker-compose.yml"
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml"
            -p thunderpipe-integration)
          "${compose[@]}" up -d --build db dbpool redis rabbitmq minio minio-init builder django nginx django-worker

      - name: 'Wait for Django database'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory "$THUNDERSTORE_DIR"
            -f "$THUNDERSTORE_DIR/docker-compose.yml"
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml"
            -p thunderpipe-integration)
          for i in $(seq 1 45); do
            if "${compose[@]}" exec -T django python manage.py shell -c \
              'from django.db import connection; connection.ensure_connection()' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo 'Django database did not become ready.' >&2
          exit 1

      - name: 'Prepare Thunderstore with its native development commands'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory "$THUNDERSTORE_DIR"
            -f "$THUNDERSTORE_DIR/docker-compose.yml"
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml"
            -p thunderpipe-integration)

          # setup_dev_env creates the administrator, communities, teams, packages,
          # versions and site mappings. Wait for storage because the bundled
          # create_test_data command uploads package icons.
          ready=0
          for i in $(seq 1 30); do
            if "${compose[@]}" exec -T django python -c \
              "import boto3; s=boto3.client('s3',endpoint_url='http://minio:9000',aws_access_key_id='thunderstore',aws_secret_access_key='thunderstore',region_name='us-east-1'); s.head_bucket(Bucket='thunderstore')" \
              >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then echo 'S3 bucket not ready for test data.' >&2; exit 1; fi

          "${compose[@]}" exec -T django python manage.py setup_dev_env
          # Native generator supplies the 105 existing communities used by the
          # pagination test, rather than hand-creating these Django records.
          "${compose[@]}" exec -T django python manage.py create_test_data \
            --only community --community-count 105

      - name: 'Wait for HTTP, S3, and Celery'
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory "$THUNDERSTORE_DIR"
            -f "$THUNDERSTORE_DIR/docker-compose.yml"
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml"
            -p thunderpipe-integration)
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 5 -H 'Host: thunderstore.localhost' \
              http://127.0.0.1/api/experimental/community/ >/dev/null; then ready=1; break; fi
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then echo 'HTTP API not ready.' >&2; exit 1; fi

          ready=0
          for i in $(seq 1 30); do
            if "${compose[@]}" exec -T django python -c \
              "import boto3; s=boto3.client('s3',endpoint_url='http://minio:9000',aws_access_key_id='thunderstore',aws_secret_access_key='thunderstore',region_name='us-east-1'); s.head_bucket(Bucket='thunderstore')" \
              >/dev/null 2>&1; then ready=1; break; fi
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then echo 'S3 bucket not ready.' >&2; exit 1; fi

          ready=0
          ping_output=''
          for i in $(seq 1 30); do
            ping_output="$("${compose[@]}" exec -T django-worker celery -A thunderstore.core inspect ping --timeout=10 2>&1)" || true
            if grep -q pong <<< "$ping_output"; then ready=1; break; fi
            sleep 5
          done
          if [[ "$ready" -ne 1 ]]; then
            echo 'Celery worker not ready. Last inspect ping output:' >&2
            printf '%s\n' "$ping_output" >&2
            "${compose[@]}" ps django-worker rabbitmq >&2 || true
            "${compose[@]}" logs --no-color --tail=80 django-worker rabbitmq >&2 || true
            exit 1
          fi

      - name: 'Prepare publishing credentials through Thunderstore HTTP API'
        shell: bash
        run: |
          set -euo pipefail
          raw="$(mktemp)"
          trap 'rm -f "$raw"' EXIT
          python3 - > "$raw" <<'PY'
          import http.cookiejar
          import json
          import urllib.parse
          import urllib.request
          
          root = "http://thunderstore.localhost"
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPCookieProcessor(jar),
          )
          
          def api(url, payload=None, auth=None):
              parsed = urllib.parse.urlsplit(url)
              if parsed.scheme != "http" or parsed.netloc != "thunderstore.localhost":
                  raise RuntimeError("Refusing off-host fixture API URL")
              headers = {}
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              if auth:
                  headers["Authorization"] = "Session " + auth
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers=headers,
              )
              with opener.open(request, timeout=30) as response:
                  return json.load(response)
          
          # setup_dev_env creates the local development admin account.
          login = root + "/djangoadmin/login/"
          with opener.open(login, timeout=30) as response:
              response.read()
          csrf = next((c.value for c in jar if c.name == "csrftoken"), None)
          if not csrf:
              raise RuntimeError("Admin login did not provide a CSRF cookie")
          form = urllib.parse.urlencode({
              "username": "admin", "password": "admin",
              "csrfmiddlewaretoken": csrf, "next": "/djangoadmin/",
          }).encode()
          request = urllib.request.Request(login, data=form, headers={"Referer": login})
          with opener.open(request, timeout=30) as response:
              response.read()
          session = next((c.value for c in jar if c.name == "sessionid"), None)
          if not session:
              raise RuntimeError("Developer admin login failed")
          
          # Authenticate through the public Cyberstorm HTTP API.
          team = "TPIntegrationCI"
          created = api(root + "/api/cyberstorm/team/create/", {"name": team}, session)
          if created.get("name") != team:
              raise RuntimeError("Team API returned unexpected name")
          account = api(
              root + "/api/cyberstorm/team/" + team + "/service-account/create/",
              {"nickname": "TPIntegrationCI"},
              session,
          )
          token = account.get("api_token")
          if not token or account.get("team_name") != team:
              raise RuntimeError("Service-account API did not return credentials")
          
          # Discover official seeded package versions via public HTTP.
          package = None
          url = root + "/api/experimental/package/"
          seen = set()
          while url and not package:
              if url in seen:
                  raise RuntimeError("Package cursor loop")
              seen.add(url)
              page = api(url)
              for item in page.get("results", []):
                  latest = item.get("latest") or {}
                  if latest.get("is_active", True) and all((
                      item.get("namespace"), item.get("name"), latest.get("version_number")
                  )):
                      package = item
                      break
              url = page.get("next")
          if not package:
              raise RuntimeError("Native create_test_data produced no readable active package")
          
          communities = []
          url = root + "/api/experimental/community/"
          seen.clear()
          while url and len(communities) < 105:
              if url in seen:
                  raise RuntimeError("Community cursor loop")
              seen.add(url)
              page = api(url)
              communities.extend(item["identifier"] for item in page["results"])
              url = (page.get("pagination") or {}).get("next_link")
          communities = list(dict.fromkeys(communities))[:105]
          if len(communities) != 105:
              raise RuntimeError("Native generator did not expose 105 communities")
          
          print(json.dumps({
              "token": token,
              "team": team,
              "seedTeam": package["namespace"],
              "seedPackage": package["name"],
              "seedVersion": package["latest"]["version_number"],
              "community": "riskofrain2",
              "pageCommunities": communities,
          }))
          PY
          jq -ce 'select(.token and .team and .seedTeam and .seedPackage and
            .seedVersion and .community and (.pageCommunities | length) == 105)' "$raw" >/dev/null
          token="$(jq -r '.token' "$raw")"
          echo "::add-mask::$token"
          jq -r '
            "THUNDERSTORE_TOKEN=\(.token)",
            "THUNDERSTORE_TEAM=\(.team)",
            "THUNDERSTORE_SEED_TEAM=\(.seedTeam)",
            "THUNDERSTORE_COMMUNITY=\(.community)",
            "THUNDERSTORE_SEED_PACKAGE=\(.seedPackage)",
            "THUNDERSTORE_SEED_VERSION=\(.seedVersion)",
            "THUNDERSTORE_PACKAGE=\(.seedTeam)-\(.seedPackage)-\(.seedVersion)",
            "THUNDERSTORE_PAGE_COMMUNITIES=\(.pageCommunities | join(","))"
          ' "$raw" >> "$GITHUB_ENV"

      - name: 'Run C# integration tests (dotnet test)'
        id: integration_tests
        working-directory: thunderpipe
        shell: bash
        run: |
          set -euo pipefail
          dotnet test ThunderPipe.Core.IntegrationTests/ThunderPipe.Core.IntegrationTests.csproj \
            -c Release --no-build --no-restore \
            --results-directory "$ARTIFACT_DIR" -- \
            --report-xunit-trx --report-xunit-trx-filename integration.trx \
            2>&1 | tee "$ARTIFACT_DIR/test.log"

      - name: 'Classify test outcome from TRX'
        if: always()
        shell: bash
        env:
          TEST_STEP_OUTCOME: ${{ steps.integration_tests.outcome }}
        run: |
          set -euo pipefail
          status=environment_failure
          trx="$ARTIFACT_DIR/integration.trx"
          if [[ -s "$trx" ]]; then
            counters="$(grep -oE '<Counters[^>]*>' "$trx" | head -n 1 || true)"
            total="$(grep -oE 'total="[0-9]+"' <<< "$counters" | cut -d '"' -f2 || true)"
            executed="$(grep -oE 'executed="[0-9]+"' <<< "$counters" | cut -d '"' -f2 || true)"
            failed="$(grep -oE 'failed="[0-9]+"' <<< "$counters" | cut -d '"' -f2 || true)"
            if [[ "${total:-0}" -gt 0 && "${executed:-0}" -gt 0 ]]; then
              if [[ "${failed:-0}" -gt 0 ]]; then
                status=test_failure
              elif [[ "$TEST_STEP_OUTCOME" == 'success' ]]; then
                status=success
              fi
            fi
          fi
          echo "$status" > "$ARTIFACT_DIR/result-category"
          echo "Integration result: $status"

      - name: 'Collect server diagnostics'
        if: always()
        shell: bash
        run: |
          mkdir -p "$ARTIFACT_DIR"
          compose=(docker compose --project-directory "$THUNDERSTORE_DIR"
            -f "$THUNDERSTORE_DIR/docker-compose.yml"
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml"
            -p thunderpipe-integration)
          "${compose[@]}" logs --no-color --timestamps > "$ARTIFACT_DIR/docker-server.log" 2>&1 || true

      - name: 'Record outcome in state branch with gh api and jq'
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          status="$(cat "$ARTIFACT_DIR/result-category" 2>/dev/null || echo environment_failure)"
          tag="$THUNDERSTORE_TAG"

          # Create the state branch once, without checking out ThunderPipe.
          if ! gh api "repos/$STATE_REPOSITORY/git/ref/heads/$STATE_BRANCH" >/dev/null 2>&1; then
            default="$(gh api "repos/$STATE_REPOSITORY" --jq '.default_branch')"
            base="$(gh api "repos/$STATE_REPOSITORY/git/ref/heads/$default" --jq '.object.sha')"
            gh api -X POST "repos/$STATE_REPOSITORY/git/refs" \
              -f ref="refs/heads/$STATE_BRANCH" -f sha="$base" >/dev/null || true
          fi

          for attempt in $(seq 1 6); do
            sha=''
            if meta="$(gh api "repos/$STATE_REPOSITORY/contents/$STATE_FILE?ref=$STATE_BRANCH" 2>/dev/null)"; then
              sha="$(jq -r '.sha' <<< "$meta")"
              state="$(jq -r '.content' <<< "$meta" | base64 --decode)"
            else
              state='{}'
            fi
            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            url="https://github.com/$STATE_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            next="$(jq -c --arg tag "$tag" --arg status "$status" --arg now "$now" --arg url "$url" --arg commit "$GITHUB_SHA" '
              .last_checked_release = $tag
              | .last_test_result = {release:$tag,status:$status,recorded_at:$now,run_url:$url,thunderpipe_commit:$commit}
              | .last_check_result = {checked_at:$now,release:$tag,requires_integration_tests:true,integration_tests_executed:($status != "environment_failure"),reason:$status}
              | if $status == "environment_failure" then
                  .pending_test_release = $tag | .last_environment_failure = .last_test_result
                else
                  .pending_test_release = null
                  | .tested_releases[$tag] = .last_test_result
                  | if $status == "success" then .last_successful_test_release = $tag else . end
                end
              ' <<< "$state")"
            encoded="$(printf '%s\n' "$next" | base64 -w 0)"
            args=(-X PUT "repos/$STATE_REPOSITORY/contents/$STATE_FILE"
              -f message="chore: record Thunderstore integration $status"
              -f branch="$STATE_BRANCH" -f content="$encoded")
            if [[ -n "$sha" ]]; then args+=(-f sha="$sha"); fi
            if gh api "${args[@]}" >/dev/null; then break; fi
            if [[ "$attempt" -eq 6 ]]; then exit 1; fi
            sleep "$attempt"
          done

      - name: 'Upload diagnostic artifacts'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thunderstore-integration-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ThunderPipe.Core.IntegrationTests/artifacts/*.trx
            ThunderPipe.Core.IntegrationTests/artifacts/*.log
            ThunderPipe.Core.IntegrationTests/artifacts/result-category

      - name: 'Stop isolated Docker services'
        if: always()
        shell: bash
        run: |
          docker compose --project-directory "$THUNDERSTORE_DIR" \
            -f "$THUNDERSTORE_DIR/docker-compose.yml" \
            -f "$GITHUB_WORKSPACE/thunderpipe/ThunderPipe.Core.IntegrationTests/docker-compose.integration.yml" \
            -p thunderpipe-integration down -v --remove-orphans || true
