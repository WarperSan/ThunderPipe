name: 'Test Integration'

env:
    THUNDERSTORE_ORGANIZATION: 'thunderstore-io'
    THUNDERSTORE_REPOSITORY: 'Thunderstore'
    THUNDERSTORE_API_REGEX: '(^|/)(models|api)(/|\.py$)' # TODO

on:
    workflow_dispatch:
    schedule:
        - cron: '0 6 1,15 * *'

permissions:
    contents: read

jobs:
    evaluate:
        name: 'Evaluate Runner'
        runs-on: ubuntu-latest
        if: github.event_name != 'workflow_dispatch'
        outputs:
            should_run: ${{ steps.evaluate.outputs.should_run }}
            tag: ${{ steps.tag.outputs.tag }}
        steps:
            -   name: 'Fetch Current Tag'
                id: tag
                env:
                    GH_TOKEN: ${{ github.token }}
                    ORGANIZATION: ${{ env.THUNDERSTORE_ORGANIZATION }}
                    REPOSITORY: ${{ env.THUNDERSTORE_REPOSITORY }}
                run: |
                    CURRENT=$(gh api "repos/$ORGANIZATION/$REPOSITORY/releases/latest" --jq .tag_name)
                    echo "tag=$CURRENT" >> "$GITHUB_OUTPUT"

            -   name: 'Evaluate'
                id: evaluate
                env:
                    GH_TOKEN: ${{ github.token }}
                    ORGANIZATION: ${{ env.THUNDERSTORE_ORGANIZATION }}
                    REPOSITORY: ${{ env.THUNDERSTORE_REPOSITORY }}
                    PREVIOUS: '' # TODO
                    CURRENT: ${{ steps.tag.outputs.tag }}
                    API_REGEX: ${{ env.THUNDERSTORE_API_REGEX }}
                run: |
                    if [ -z "$PREVIOUS" ]; then
                        echo "No previous tag to compare against."
                        echo "should_run=true" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi

                    if [ "$PREVIOUS" == "$CURRENT" ]; then
                        echo "No new release."
                        echo "should_run=false" >> "$GITHUB_OUTPUT"
                        exit 0
                    fi

                    FILES=$(gh api "repos/$ORGANIZATION/$REPOSITORY/compare/$PREVIOUS...$CURRENT" --jq '.files[].filename')

                    CHANGED=$(grep -E "$API_REGEX" <<< "$FILES" || true)

                    if [ -n "$CHANGED" ]; then
                        echo "Found relevant changes in the following files:"
                        echo "$CHANGED"
                        echo "should_run=true" >> "$GITHUB_OUTPUT"
                    else
                        echo "No relevant changes found."
                        echo "should_run=false" >> "$GITHUB_OUTPUT"
                    fi
    test:
        name: 'Run Tests'
        runs-on: ubuntu-latest
        needs: evaluate
        if: needs.evaluate.outputs.should_run == 'true'
        timeout-minutes: 30
        steps:
            -   name: 'Clone Thunderstore'
                uses: actions/checkout@v4
                with:
                    repository: ${{ env.THUNDERSTORE_ORGANIZATION }}/${{ env.THUNDERSTORE_REPOSITORY }}
                    ref: ${{ needs.evaluate.outputs.tag }}
                    path: 'thunderstore'
                    persist-credentials: 'false'

            -   name: 'Clone ThunderPipe'
                uses: actions/checkout@v4
                with:
                    path: 'thunderpipe'
                    persist-credentials: 'false'

            -   uses: actions/setup-dotnet@v4
                with:
                    global-json-file: 'thunderpipe/global.json'

            -   name: 'Configure Thunderstore'
                working-directory: 'thunderstore'
                run: |
                    cp .env.template .env

            -   name: 'Start Thunderstore'
                working-directory: 'thunderstore'
                run: |
                    docker compose up -d --build django nginx django-worker
                    docker compose up minio-init --exit-code-from minio-init

            -   name: 'Wait for Thunderstore'
                working-directory: 'thunderstore'
                run: |
                    for i in $(seq 1 60); do
                        curl -sf http://localhost/api/experimental/community/ && exit 0
                        sleep 5
                    done

                    echo "::error::Thunderstore never became healthy"
                    docker compose ps
                    exit 1

            -   name: 'Seed Thunderstore'
                working-directory: 'thunderstore'
                run: docker compose exec -T django python manage.py setup_dev_env

            -   name: 'Run Integration Tests'
                working-directory: 'thunderpipe'
                run: echo "all good"

            -   name: 'Dump logs'
                if: failure()
                working-directory: 'thunderstore'
                run: docker compose logs
